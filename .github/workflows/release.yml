name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '预检版本（只构建和验收，不发布 Release）'
        required: true
        default: v0.1.1
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate release tag
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          printf 'RELEASE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Build Web assets
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
      - name: Validate application
        run: |
          go test -race ./...
          go vet ./...
          node --test web/tests/unit/yaml.test.mjs
          sh -n install.sh
          sh -n deploy/install.sh
          sh -n scripts/release/build.sh
          shellcheck install.sh deploy/install.sh scripts/release/build.sh
      - name: Validate Web browser flows
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/miproxy-browser/node_modules/playwright/index.mjs
          PLAYWRIGHT_CHANNEL: chromium
          MIPROXY_TEST_URL: http://127.0.0.1:18788/
        run: |
          npm install --prefix "$RUNNER_TEMP/miproxy-browser" --no-save --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/miproxy-browser/node_modules/playwright/cli.js" install --with-deps chromium
          python3 -m http.server 18788 --bind 127.0.0.1 --directory web/dist >"$RUNNER_TEMP/miproxy-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18788/ >/dev/null; then break; fi
            sleep 1
          done
          node web/tests/browser/core-dialog.smoke.mjs
          node web/tests/browser/discovery-ui.smoke.mjs
          node web/tests/browser/runtime-ui.smoke.mjs
          node web/tests/browser/unified-rules.smoke.mjs
          node web/tests/browser/access-settings.smoke.mjs
      - name: Build release binaries and checksums
        run: sh scripts/release/build.sh "$RELEASE_VERSION" dist-release
      - name: Validate compiled runtime and access settings
        run: python3 tests/integration/runtime.py --binary dist-release/miproxy-panel_linux_amd64
      - name: Validate Linux direct installation and systemd lifecycle
        run: sudo env MIPROXY_TEST_ISOLATED=1 python3 tests/integration/linux_install.py --release-dir dist-release
      - uses: actions/upload-artifact@v7
        with:
          name: miproxy-panel-${{ env.RELEASE_VERSION }}
          path: dist-release/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f "docs/releases/$RELEASE_VERSION.md" ]; then
            gh release create "$RELEASE_VERSION" --verify-tag --draft --title "$RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md" dist-release/*
          else
            gh release create "$RELEASE_VERSION" --verify-tag --draft --title "$RELEASE_VERSION" --generate-notes dist-release/*
          fi
          gh release edit "$RELEASE_VERSION" --draft=false --latest
